  function drawUpgradeIcon(kind, cx, cy, size, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    if (kind === 'bolt') {
      ctx.beginPath();
      ctx.moveTo(size * 0.12, -size * 0.62);
      ctx.lineTo(-size * 0.36, size * 0.06);
      ctx.lineTo(-size * 0.02, size * 0.06);
      ctx.lineTo(-size * 0.14, size * 0.66);
      ctx.lineTo(size * 0.38, -size * 0.08);
      ctx.lineTo(size * 0.02, -size * 0.08);
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'bottle') {
      ctx.beginPath();
      ctx.moveTo(-size * 0.26, -size * 0.62);
      ctx.lineTo(size * 0.26, -size * 0.62);
      ctx.lineTo(size * 0.26, -size * 0.34);
      ctx.quadraticCurveTo(size * 0.46, -size * 0.2, size * 0.4, size * 0.62);
      ctx.lineTo(-size * 0.4, size * 0.62);
      ctx.quadraticCurveTo(-size * 0.46, -size * 0.2, -size * 0.26, -size * 0.34);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.fillRect(-size * 0.3, size * 0.16, size * 0.6, size * 0.14);
    } else if (kind === 'drop') {
      dropletPath(0, 0, size * 0.55);
      ctx.fill();
    } else if (kind === 'leaf') {
      ctx.beginPath();
      ctx.moveTo(-size * 0.5, size * 0.4);
      ctx.quadraticCurveTo(-size * 0.5, -size * 0.5, size * 0.5, -size * 0.5);
      ctx.quadraticCurveTo(size * 0.5, size * 0.4, -size * 0.5, size * 0.4);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-size * 0.3, size * 0.25);
      ctx.lineTo(size * 0.35, -size * 0.35);
      ctx.stroke();
    } else if (kind === 'triple') {
      for (let i = -1; i <= 1; i++) {
        if (i === 0) ctx.fillStyle = '#ffffff';
        else ctx.fillStyle = color;
        dropletPath(i * size * 0.34, i === 0 ? -size * 0.12 : size * 0.04, size * 0.25);
        ctx.fill();
      }
    } else if (kind === 'wind') {
      ctx.beginPath();
      ctx.moveTo(-size * 0.55, -size * 0.3);
      ctx.lineTo(size * 0.2, -size * 0.3);
      ctx.quadraticCurveTo(size * 0.52, -size * 0.3, size * 0.4, -size * 0.02);
      ctx.quadraticCurveTo(size * 0.32, size * 0.16, size * 0.12, size * 0.02);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-size * 0.55, size * 0.16);
      ctx.lineTo(size * 0.05, size * 0.16);
      ctx.quadraticCurveTo(size * 0.3, size * 0.16, size * 0.22, size * 0.42);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-size * 0.55, -size * 0.02);
      ctx.lineTo(-size * 0.12, -size * 0.02);
      ctx.stroke();
    } else if (kind === 'star') {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        const rr = i % 2 === 0 ? size * 0.6 : size * 0.26;
        const px = Math.cos(a) * rr, py2 = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py2); else ctx.lineTo(px, py2);
      }
      ctx.closePath();
      ctx.fill();
    } else if (kind === 'heart') {
      heartPath(0, 0, size * 0.52);
      ctx.fill();
    }
    ctx.restore();
  }

  function wrapText(text, maxWidth, font) {
    ctx.save();
    ctx.font = font;
    const chars = text.split('');
    const lines = [];
    let line = '';
    for (let i = 0; i < chars.length; i++) {
      const test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = chars[i];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    ctx.restore();
    return lines;
  }

  function drawCard(r, hovered, index) {
    const card = r.card;
    const x = r.x;
    const y = r.y + (hovered ? -8 : 0);
    ctx.save();
    if (hovered) {
      ctx.shadowColor = rgba(card.color, 0.55);
      ctx.shadowBlur = 28;
      ctx.shadowOffsetY = 8;
    } else {
      ctx.shadowColor = 'rgba(60,35,10,.28)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;
    }
    const bg = ctx.createLinearGradient(x, y, x, y + r.h);
    bg.addColorStop(0, '#fffdf7');
    bg.addColorStop(1, '#fff1d8');
    ctx.fillStyle = bg;
    roundRect(x, y, r.w, r.h, 18);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = hovered ? card.color : 'rgba(205,170,120,.8)';
    ctx.lineWidth = hovered ? 3 : 2;
    roundRect(x, y, r.w, r.h, 18);
    ctx.stroke();

    const cx = x + r.w / 2;
    const cy = y + 76;
    ctx.fillStyle = rgba(card.color, 0.16);
    ctx.beginPath();
    ctx.arc(cx, cy, 36, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(card.color, 0.55);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 36, 0, TAU);
    ctx.stroke();
    drawUpgradeIcon(card.icon, cx, cy, 30, card.color);

    label(card.name, cx, y + 144, 24, '#5a3a1a', 'center', 800);
    const lines = wrapText(card.desc, r.w - 44, '500 15px "PingFang SC","Microsoft YaHei",sans-serif');
    for (let i = 0; i < lines.length; i++) {
      label(lines[i], cx, y + 184 + i * 23, 15, '#8a6a45', 'center', 500);
    }

    ctx.fillStyle = rgba(card.color, 0.18);
    roundRect(x + 22, y + r.h - 52, r.w - 44, 32, 10);
    ctx.fill();
    label('按 ' + (index + 1) + ' 选择', cx, y + r.h - 36, 14, '#6b4a26', 'center', 800);
  }

  /* =========================================================
     主渲染
     ========================================================= */
  function render() {
    ctx.save();
    if (G.shake > 0.4) {
      ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
    }
    drawBackground();
    drawPuddles();
    drawDrops();
    drawEnemies();
    if (G.state !== 'title') drawPlayer();
    drawBullets();
    drawEBullets();
    drawParticles();
    drawTexts();
    ctx.restore();

    if (G.state === 'playing' || G.state === 'paused') drawHUD();

    if (G.flash > 0) {
      ctx.fillStyle = 'rgba(255,70,90,' + (G.flash * 0.3).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (G.state === 'title') drawTitle();
    else if (G.state === 'upgrade') drawUpgradeScreen();
    else if (G.state === 'paused') drawPauseScreen();
    else if (G.state === 'over') drawGameOverScreen();
  }

  /* =========================================================
     启动
     ========================================================= */
  let lastTime = 0;
  function frame(now) {
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  buildBackground();
  layout();
  requestAnimationFrame(frame);

  // 调试 / 截图接口（不影响正常游玩）
  window.__milkfrog = {
    G, P,
    start: startGame,
    wave: startWave,
    spawn: spawnEnemy,
    openUpgrade,
    chooseCard,
    gameOver,
    step(n, dt) {
      const arr = n == null ? 1 : n;
      const step = dt == null ? 1 / 60 : dt;
      for (let i = 0; i < arr; i++) update(step);
    },
    render,
  };

  const q = new URLSearchParams(location.search);
  if (q.get('auto') === '1') {
    startGame();
    if (q.get('wave')) {
      const w = Math.max(1, parseInt(q.get('wave'), 10) || 1);
      G.enemies.length = 0;
      G.spawnQueue = [];
      G.wave = w - 1;
      startWave(w);
    }
  }
  if (q.get('boss') === '1') {
    if (G.state === 'title') startGame();
    G.wave = 5;
    G.phase = 'fight';
    G.spawnQueue = [];
    G.enemies.length = 0;
    spawnEnemy('boss');
  }
  if (q.get('upgrade') === '1') {
    if (G.state === 'title') startGame();
    G.wave = 4;
    G.phase = 'cleared';
    G.phaseT = 99;
    openUpgrade();
  }
  if (q.get('demo') === '1') {
    G.demo = true;
    G.god = true;
    if (G.state === 'title') startGame();
  }
  if (q.get('over') === '1') {
    if (G.state === 'title') startGame();
    G.wave = 7;
    G.score = 18420;
    G.kills = 96;
    P.hearts = 0;
    gameOver();
  }
})();
</script>
